name: SEO monitor

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: "Single client slug (blank runs all)"
        required: false
      backfill:
        description: "Days of history to pull"
        required: false
        default: "0"
      dry_run:
        description: "Dry run: log alerts without writing the run summary"
        type: boolean
        default: false

concurrency:
  group: seo-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          python run.py \
            ${{ inputs.client && format('--client {0}', inputs.client) || '' }} \
            ${{ inputs.backfill != '0' && inputs.backfill && format('--backfill {0}', inputs.backfill) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit history and dashboard
        if: always()
        run: |
          git config user.name "seo-monitor"
          git config user.email "seo-monitor@users.noreply.github.com"
          git add data public
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Monitor run $(date -u +%Y-%m-%d)"
            git push
          fi
