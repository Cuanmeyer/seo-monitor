# Client configuration. Thresholds live here, not in code, so they can be
# tuned per client without a redeploy. Add a new client by adding a block.

defaults:
  # GSC finalises data 2-3 days behind. Never evaluate inside this window.
  gsc_lag_days: 3

  # Rolling baseline. 28 days is exactly 4 of each weekday, so a 7-day window
  # compared against (28-day sum / 4) is weekday-aligned by construction.
  current_window_days: 7
  baseline_window_days: 28

  # Volume floors. Below these, movement is noise and no alert is raised.
  min_baseline_clicks_per_week: 100
  min_page_impressions: 50

  thresholds:
    organic_clicks:
      warning_pct: -20
      critical_pct: -35
      persist_runs: 3
    organic_impressions:
      # Context only. Impressions are a leading indicator, not an outcome:
      # a fall with clicks holding steady means CTR went up. These thresholds
      # still drive the dashboard status so a slide is visible early, but they
      # do not raise an alert. Set alert: true to put a client back on the
      # old behaviour.
      alert: false
      warning_pct: -20
      critical_pct: -35
      persist_runs: 3
    ctr_divergence:
      # Fires when CTR falls while impressions hold up: clicks are being lost
      # at the SERP rather than through lost visibility.
      warning_ctr_drop_pct: -20
      impressions_holding_above_pct: -5
      persist_runs: 2
    indexation_priority:
      persist_runs: 1
    indexation_rate:
      warning_drop_points: 5
      persist_runs: 2
    core_web_vitals:
      warning_good_drop_points: 10
      warning_poor_rise_points: 5
      persist_runs: 1
    llm_referrals:
      # Small numbers swing hard in percentage terms, so this needs a real
      # volume floor and two consecutive runs before it is worth saying.
      min_baseline_sessions: 100
      warning_pct: -30
      persist_runs: 2

