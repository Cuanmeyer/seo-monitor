# Netlify serves the static dashboard the monitor writes. No build step:
# whatever the last run committed to public/ is what gets served.

[build]
  publish = "public"
  command = ""
  # Decides whether a commit is worth publishing. Exit 0 skips, exit 1 builds.
  # See tools/should_deploy.sh for the reasoning.
  ignore = "bash tools/should_deploy.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=300"
