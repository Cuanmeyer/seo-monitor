<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Health Monitor</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-soft: rgba(208, 59, 59, 0.10);
    --row-hot: rgba(208, 59, 59, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255,255,255,0.10); --series: #3987e5;
      --critical-soft: rgba(208,59,59,0.16); --row-hot: rgba(208,59,59,0.09);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10); --series: #3987e5;
    --critical-soft: rgba(208,59,59,0.16); --row-hot: rgba(208,59,59,0.09);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 64px;
    background: var(--plane); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  header { padding: 40px 0 20px; }
  h1 { font-size: 26px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  h2 { font-size: 17px; font-weight: 620; margin: 0 0 4px; }
  h3 { font-size: 13px; font-weight: 600; margin: 0 0 14px; color: var(--ink-2); }

  /* Headline band */
  .band { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .band .cell { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
  .band .n { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
  .band .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .band .cell.alarm .n { color: var(--critical); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-weight: 600; color: var(--ink-2);
    padding: 9px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-size: 13px;
  }
  td { padding: 11px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr.hot td { background: var(--row-hot); }
  .num { font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; margin: 0 -4px; }
  .client-cell { font-weight: 600; }
  .client-cell .dom { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .delta { font-variant-numeric: tabular-nums; }
  .delta.bad { color: var(--critical); font-weight: 600; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 560; white-space: nowrap;
    padding: 2px 8px 2px 6px; border-radius: 99px; border: 1px solid var(--border);
  }
  .dot { width: 7px; height: 7px; border-radius: 99px; flex: none; }
  .pill.good .dot { background: var(--good); }
  .pill.warning .dot { background: var(--warning); }
  .pill.watching .dot { background: var(--serious); }
  .pill.critical .dot { background: var(--critical); }
  .pill.unknown .dot { background: var(--muted); }
  .pill.critical { color: var(--critical); border-color: var(--critical); }

  .lights { display: inline-flex; gap: 4px; }
  .light { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .light.good { background: var(--good); }
  .light.warning { background: var(--warning); }
  .light.watching { background: var(--serious); }
  .light.critical { background: var(--critical); }
  .light.unknown { background: var(--grid); }

  .alert {
    border: 1px solid var(--border); border-left: 3px solid var(--warning);
    border-radius: 8px; padding: 13px; margin-bottom: 10px;
  }
  .alert.critical { border-left-color: var(--critical); }
  .alert .a-head { font-weight: 600; margin-bottom: 4px; }
  .alert .a-meta { font-size: 12.5px; color: var(--ink-2); }
  .alert ul { margin: 7px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .alert .a-hint { font-size: 13px; color: var(--ink-2); margin-top: 7px; font-style: italic; }
  .alert a { color: var(--series); }

  details.client { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--surface); }
  details.client > summary {
    cursor: pointer; padding: 13px 16px; font-weight: 600; font-size: 14.5px;
    display: flex; align-items: center; gap: 10px; list-style: none;
  }
  details.client > summary::-webkit-details-marker { display: none; }
  details.client > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
  details.client[open] > summary::before { content: "▾"; }
  details.client > summary .s-meta { margin-left: auto; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .client-body { padding: 0 16px 18px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { border: 1px solid var(--border); border-radius: 9px; padding: 12px; }
  .kpi .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 22px; font-weight: 640; margin-top: 3px; letter-spacing: -0.02em; }
  .kpi .d { font-size: 12.5px; margin-top: 2px; color: var(--ink-2); }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }
  .chart-wrap { position: relative; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .chart-note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); transition: opacity .1s; z-index: 5; min-width: 140px;
  }
  .tooltip .t-date { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 12.5px; padding-top: 10px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>

const fmt = n => (n === null || n === undefined) ? "—" : n.toLocaleString("en-ZA");
const pct = (a, b) => (a === null || a === undefined || !b) ? null : ((a - b) / b) * 100;
const signed = v => v === null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%";

const LABELS = { good:"OK", warning:"Warning", watching:"Watching", critical:"Critical", unknown:"No data" };
const RANK   = { critical:0, warning:1, watching:2, unknown:3, good:4 };

function worstStatus(c) {
  let worst = "good";
  Object.values(c.statuses || {}).forEach(s => {
    if (RANK[s.state] < RANK[worst]) worst = s.state;
  });
  return worst;
}

function pill(state, label) {
  const el = document.createElement("span");
  el.className = "pill " + state;
  el.innerHTML = `<span class="dot"></span>${label || LABELS[state] || state}`;
  return el;
}

/* ---------- chart (built lazily, only when a client is expanded) ------ */
function lineChart(container, opts) {
  const { dates, values, baseline, warningPct, label } = opts;
  const W = 640, H = 200, P = { t: 12, r: 12, b: 24, l: 46 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;

  const all = values.concat(baseline.filter(v => v !== null));
  const min = 0, ticks = 4;
  const rough = (Math.max(...all) * 1.08) / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const step = ([1,2,2.5,5,10].find(m => m * mag >= rough) || 10) * mag;
  const max = step * ticks;

  const x = i => P.l + (i / Math.max(1, dates.length - 1)) * iw;
  const y = v => P.t + ih - ((v - min) / (max - min)) * ih;

  const path = arr => {
    let d = "", pen = false;
    arr.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      pen = true;
    });
    return d.trim();
  };

  const lower = baseline.map(v => v === null ? null : v * (1 + warningPct / 100));
  const top = [], bottom = [];
  baseline.forEach((v, i) => {
    if (v === null || lower[i] === null) return;
    top.push(`${x(i).toFixed(1)} ${y(v).toFixed(1)}`);
    bottom.unshift(`${x(i).toFixed(1)} ${y(lower[i]).toFixed(1)}`);
  });
  const band = top.length ? "M" + top.join(" L ") + " L " + bottom.join(" L ") + " Z" : "";

  let gridlines = "", ylabels = "";
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * (i / ticks), yy = y(v).toFixed(1);
    const tick = v >= 1000 ? (v % 1000 === 0 ? v/1000 : (v/1000).toFixed(1)) + "k" : String(Math.round(v));
    gridlines += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    ylabels += `<text x="${P.l-8}" y="${yy}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--muted)">${tick}</text>`;
  }
  let xlabels = "";
  [0, Math.floor(dates.length/2), dates.length-1].forEach(i => {
    if (i < 0 || i >= dates.length) return;
    const d = new Date(dates[i]);
    const anchor = i === 0 ? "start" : (i === dates.length-1 ? "end" : "middle");
    xlabels += `<text x="${x(i).toFixed(1)}" y="${H-5}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${d.toLocaleDateString("en-ZA",{day:"numeric",month:"short"})}</text>`;
  });

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} over ${dates.length} days against its rolling baseline">
      ${gridlines}${ylabels}${xlabels}
      <path d="${band}" fill="var(--critical-soft)"/>
      <path d="${path(baseline)}" fill="none" stroke="var(--axis)" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="${path(values)}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="crosshair" y1="${P.t}" y2="${P.t+ih}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
      <circle class="focus" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    </svg>`;

  const svg = container.querySelector("svg");
  const tip = document.createElement("div");
  tip.className = "tooltip";
  container.appendChild(tip);
  const crosshair = svg.querySelector(".crosshair"), focus = svg.querySelector(".focus");

  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const px = ((ev.clientX - box.left) / box.width) * W;
    if (px < P.l || px > W - P.r) return;
    const i = Math.round(((px - P.l) / iw) * (dates.length - 1));
    if (i < 0 || i >= dates.length) return;
    crosshair.setAttribute("x1", x(i)); crosshair.setAttribute("x2", x(i));
    crosshair.setAttribute("opacity", "0.5");
    focus.setAttribute("cx", x(i)); focus.setAttribute("cy", y(values[i]));
    focus.setAttribute("opacity", "1");
    const base = baseline[i], change = base ? pct(values[i], base) : null;
    tip.innerHTML =
      `<div class="t-date">${new Date(dates[i]).toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"})}</div>` +
      `<div class="t-row"><span>${label}</span><strong>${fmt(values[i])}</strong></div>` +
      (base ? `<div class="t-row"><span>Baseline</span><span>${fmt(Math.round(base))}</span></div>
               <div class="t-row"><span>Change</span><span>${signed(change)}</span></div>` : "");
    tip.style.opacity = "1";
    tip.style.left = Math.min(Math.max((x(i)/W)*box.width - 70, 0), box.width - 160) + "px";
    tip.style.top = "6px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    crosshair.setAttribute("opacity","0"); focus.setAttribute("opacity","0");
  });
}

        }
      });
      body.appendChild(charts);

      const sources = Object.entries(c.source_status || {});
      if (sources.length) {
        const p = document.createElement("p");
        p.style.cssText = "font-size:12.5px;color:var(--muted);margin:16px 0 0";
        p.textContent = "Collectors — " + sources.map(([k,v]) => `${k}: ${v.ok ? "ok" : "FAILED"}`).join(" · ");
        body.appendChild(p);
      }
    });

    app.appendChild(d);
  });

  document.getElementById("foot").textContent =
    "Thresholds are configured per client. A signal shows No data until it has a full 35 days of history.";
}

render();
</script>
</body>
</html>
